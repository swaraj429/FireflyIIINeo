name: neo_sms_engine
description: Platform-native SMS reading for FireflyIII Neo
version: 1.0.0
homepage: https://github.com/fireflyneo/neo

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.fireflyneo.sms_engine
        pluginClass: NeoSmsEnginePlugin
      web:
        pluginClass: NeoSmsEnginePluginWeb
        fileName: neo_sms_engine_web.dart

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
