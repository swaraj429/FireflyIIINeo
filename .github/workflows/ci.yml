name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/neo_backend/go.sum
      - name: Install dependencies
        working-directory: backend/neo_backend
        run: go mod download
      - name: Run Tests
        working-directory: backend/neo_backend
        run: go test -v ./...

  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
      - name: Install Melos
        run: dart pub global activate melos
      - name: Melos Bootstrap
        run: melos bootstrap
      - name: Flutter Analyze
        run: melos analyze
      - name: Flutter Test
        run: melos test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release
